<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Let's Play — Live Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <div class="dash">

    <header class="dash-head">
      <div>
        <span class="dash-title">Let's Play</span>
        <span class="dash-sub">live activity <span class="pulse-dot" id="pulse-dot"></span></span>
      </div>
      <div class="dash-meta">
        <span id="connection-status" class="connection-status">Connecting…</span>
        <span id="last-updated">waiting for a real event</span>
      </div>
    </header>

    <section class="kpi-row">
      <div class="kpi">
        <span class="kpi-label">Active learners · 15 min</span>
        <span class="kpi-value" id="kpi-active">—</span>
      </div>
      <div class="kpi">
        <span class="kpi-label">Screens completed today</span>
        <span class="kpi-value" id="kpi-lessons">—</span>
      </div>
      <div class="kpi">
        <span class="kpi-label">Events received today</span>
        <span class="kpi-value" id="kpi-streaks">—</span>
      </div>
      <div class="kpi kpi-word">
        <span class="kpi-label">Latest activity</span>
        <span class="kpi-value kpi-word-value" id="kpi-word">—</span>
      </div>
    </section>

    <section class="lower-row">
      <div class="panel leaderboard">
        <h2>Top languages today</h2>
        <div id="lang-bars" class="lang-bars"></div>
      </div>

      <div class="panel feed">
        <h2>Activity feed</h2>
        <ul id="feed-list" class="feed-list"></ul>
      </div>
    </section>

  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../src/js/supabase-config.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
